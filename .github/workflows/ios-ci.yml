name: iOS CI

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios-ci.yml"]

# Read-only token: nothing here pushes, comments, or publishes.
permissions:
  contents: read

jobs:
  build:
    # Only a macOS runner has the Swift/iOS SDK toolchain needed to build this at all.
    # This is currently the only place OpenScreenTimeParentKit actually gets compiled
    # and tested - there's no Mac/Xcode in the normal dev loop for this repo, so a
    # green run here is the real signal for whether the Swift code is even valid.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Resolve package dependencies
        run: swift package resolve

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -scheme OpenScreenTimeParentKit \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation

      - name: Find an available iOS simulator
        id: sim
        run: |
          # Runner images periodically drop older device names as Xcode updates, so
          # rather than pin one (e.g. "iPhone 15", which broke once already), pick
          # whatever iPhone simulator is actually installed on this runner right now.
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | test("iPhone"))][0].udid')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "No iPhone simulator found on this runner:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          xcodebuild test \
            -scheme OpenScreenTimeParentKit \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -skipMacroValidation
