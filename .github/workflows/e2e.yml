name: E2E Pairing Test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'shared/**'
      - 'kid/**'
      - 'parent/**'
      - 'e2e/**'
      - 'firebase/**'
      - 'firebase.json'
      - '.github/workflows/e2e.yml'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # firebase-tools requires JDK 21+ to run its emulators; Gradle/AGP run fine
      # under 21 too (the app's own compiled bytecode target stays Java 17, set
      # separately in each module's build.gradle.kts), so one JDK covers both.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Real, ephemeral Firestore + Auth backend for the test to run against -
      # loads the actual firebase/firestore.rules from this repo, so a passing
      # test genuinely exercises those rules, not a stand-in for them.
      - name: Start Firebase emulators (Firestore + Auth)
        run: |
          firebase emulators:start --project openscreentime-e2e --only firestore,auth > /tmp/firebase-emulators.log 2>&1 &
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/8080) 2>/dev/null && (echo > /dev/tcp/127.0.0.1/9099) 2>/dev/null; then
              echo "Emulators are up."
              exit 0
            fi
            sleep 2
          done
          echo "Emulators did not come up in time"
          cat /tmp/firebase-emulators.log
          exit 1

      # Standard recipe for reactivecircus/android-emulator-runner on GitHub-hosted
      # Linux runners: without this, the emulator boots with no hardware
      # acceleration and is extremely slow or times out.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # No gradle-wrapper.jar is checked into this repo (see README), so install
      # Gradle directly rather than relying on ./gradlew, same as android-ci.yml.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Same stub as android-ci.yml - the google-services plugin needs *a* file to
      # process at build time, even though these builds point at the emulator.
      - name: Write stub google-services.json
        run: |
          for app in kid parent; do
            cat > "$app/google-services.json" <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "openscreentime-e2e",
              "storage_bucket": "openscreentime-e2e.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "org.openscreentime.APP" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "stub" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF
            sed -i "s/org.openscreentime.APP/org.openscreentime.$app/" "$app/google-services.json"
          done

      # -PuseFirebaseEmulator=true is the opt-in flag read in each app's build.gradle.kts
      # (see BuildConfig.USE_FIREBASE_EMULATOR) - only this workflow ever sets it.
      - name: Build kid + parent debug APKs (pointed at the Firebase emulator)
        run: gradle :kid:assembleDebug :parent:assembleDebug -PuseFirebaseEmulator=true --stacktrace

      - name: Run pairing tests on a real Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r kid/build/outputs/apk/debug/kid-debug.apk
            adb install -r parent/build/outputs/apk/debug/parent-debug.apk
            adb logcat -c
            adb logcat > /tmp/logcat.txt &
            LOGCAT_PID=$!
            set +e
            gradle :shared:connectedDebugAndroidTest :e2e:connectedDebugAndroidTest --stacktrace
            TEST_EXIT=$?
            set -e
            kill "$LOGCAT_PID" || true
            exit $TEST_EXIT

      - name: Upload connected test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-test-reports
          path: |
            shared/build/reports/androidTests/connected
            e2e/build/reports/androidTests/connected
          if-no-files-found: ignore

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat
          path: /tmp/logcat.txt
          if-no-files-found: ignore

      - name: Show relevant logcat lines on failure
        if: failure()
        run: |
          echo "=== Crashes / exceptions ==="
          grep -iE "FATAL EXCEPTION|AndroidRuntime|Process.*died|ActivityTaskManager.*Crash" /tmp/logcat.txt | tail -100 || echo "(none found)"
          echo ""
          echo "=== Lines mentioning this app ==="
          grep -i "openscreentime" /tmp/logcat.txt | tail -200 || echo "(none found)"

      - name: Show Firebase emulator log on failure
        if: failure()
        run: cat /tmp/firebase-emulators.log || true
