name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token: nothing here pushes, comments, or publishes.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # CI has no real Firebase project. The cloud flavor reads its config from this one file
      # (see FirebaseBootstrap); the local flavor never looks at it and contains no Firebase at
      # all. This is NOT a real config - do not reuse it.
      - name: Write stub google-services.json
        run: |
          mkdir -p cloud/src/main/assets
          cat > cloud/src/main/assets/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "openscreentime-ci",
              "storage_bucket": "openscreentime-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "org.openscreentime.kid" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "stub" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000001",
                  "android_client_info": { "package_name": "org.openscreentime.parent" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "stub" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      # The repo doesn't check in a gradle-wrapper.jar binary, so CI installs
      # Gradle directly rather than relying on ./gradlew. If you've generated
      # a wrapper locally (see README), ./gradlew works fine for local builds.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APKs and run unit tests
        run: gradle assembleDebug testLocalDebugUnitTest testCloudDebugUnitTest :shared:testDebugUnitTest --stacktrace

      # Runs R8 (minification) and resource shrinking on the release variants, so a bad keep rule
      # shows up here rather than on the first signed build. Unsigned - no keystore in CI.
      - name: Minify release builds (R8)
        run: gradle :kid:minifyLocalReleaseWithR8 :parent:minifyLocalReleaseWithR8 :kid:minifyCloudReleaseWithR8 :parent:minifyCloudReleaseWithR8 --stacktrace
